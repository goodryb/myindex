name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'            # 打 v1.2.0 等 tag 时自动构建发布
  workflow_dispatch:    # 支持手动触发

env:
  IMAGE_SUFFIX: myindex

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # QEMU 用于在 x86 runner 上模拟其他架构（如 arm64）执行构建
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 多架构：amd64 + arm64（arm64 适配 openwrt 等设备）
          platforms: linux/amd64,linux/arm64
          # latest + 版本 tag（如 v1.2.0）
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_SUFFIX }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_SUFFIX }}:${{ github.ref_name }}